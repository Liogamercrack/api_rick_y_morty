<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty API</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        #mostrar_personajes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            width: 220px;
            background-color: #333;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            margin: 5px;
        }
    </style>
</head>

<body>

    <h1>Personajes de Rick and Morty</h1>

    <div id="mostrar_personajes"></div>

    <script>

        async function mostrar(){

            try{

                let datos = await fetch("https://rickandmortyapi.com/api/character");
                let personajes = await datos.json();

                let contenedor = "";

                for(let i = 0; i < personajes.results.length; i++){

                    contenedor +=
                    '<div class="card">' +
                        '<img src="' + personajes.results[i].image + '">' +
                        '<h3>' + personajes.results[i].name + '</h3>' +
                        '<p>Especie: ' + personajes.results[i].species + '</p>' +
                        '<p>Estado: ' + personajes.results[i].status + '</p>' +
                        '<p>Género: ' + personajes.results[i].gender + '</p>' +
                    '</div>';

                }

                document.getElementById("mostrar_personajes").innerHTML = contenedor;

            } catch(error){

                alert("Error de conexion " + error);

            }

        }

        mostrar();

    </script>

</body>
</html>
